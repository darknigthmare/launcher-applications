<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Un launcher personnel pour retrouver rapidement mes applications, jeux et outils publiés sur Vercel.">
  <meta name="theme-color" content="#101214">
  <meta property="og:title" content="Mon Launcher">
  <meta property="og:description" content="Applications, jeux et outils réunis dans un seul catalogue.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://launcher-applications.vercel.app/">
  <link rel="canonical" href="https://launcher-applications.vercel.app/">
  <link rel="icon" href="assets/launcher-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/social-features.css">
  <title>Mon Launcher — Applications, jeux et outils</title>
  <style>
    :root {
      --bg: #101214;
      --panel: rgba(20, 23, 27, 0.78);
      --panel-strong: rgba(25, 29, 34, 0.92);
      --text: #f4f0e8;
      --muted: #b8c0c9;
      --line: rgba(255, 255, 255, 0.16);
      --accent: #70d6ff;
      --accent-2: #ffcf5a;
      --danger: #ff7a90;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    :where(button, a, input, select, textarea):focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 78%, white 22%);
      outline-offset: 3px;
    }

    .stage {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(120deg, rgba(11, 16, 20, 0.34), rgba(6, 7, 9, 0.82)),
        var(--active-image, linear-gradient(135deg, #1f3b52, #332b46 46%, #483326));
      background-position: center;
      background-size: cover;
      transform: scale(1.04);
      transition: background 360ms ease, filter 360ms ease;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 12%, rgba(112, 214, 255, 0.18), transparent 30%),
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: auto, 42px 42px, 42px 42px;
      pointer-events: none;
    }

    .shell {
      width: min(1440px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 0;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 340px;
      gap: 16px;
    }

    .sidebar,
    .content,
    .details {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .sidebar,
    .details {
      border-radius: 8px;
      align-self: start;
      position: sticky;
      top: 22px;
      max-height: calc(100vh - 44px);
      overflow: auto;
    }

    .sidebar {
      padding: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(135deg, #70d6ff, #ffcf5a);
      color: #111;
      font-weight: 900;
      letter-spacing: 0;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 1.12rem;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 3px;
    }

    .search {
      position: relative;
      margin-bottom: 18px;
    }

    .search input,
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.24);
      color: var(--text);
    }

    .search input {
      height: 42px;
      padding: 0 12px 0 38px;
    }

    .search svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .nav-title {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      margin: 18px 0 10px;
    }

    .category-list {
      display: grid;
      gap: 7px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag-filter {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 10px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .tag-filter.active,
    .tag-filter:hover {
      color: var(--text);
      border-color: color-mix(in srgb, var(--accent) 70%, white 10%);
      background: rgba(255, 255, 255, 0.12);
    }

    .category-button {
      width: 100%;
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--text);
      background: transparent;
      cursor: pointer;
    }

    .category-button:hover,
    .category-button.active {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.09);
    }

    .category-meta {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .category-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--category-color);
      flex: 0 0 auto;
    }

    .category-count {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .category-group {
      display: grid;
      gap: 6px;
    }

    .game-taxonomy-list {
      display: grid;
      gap: 7px;
      margin: 0 0 4px 15px;
      padding-left: 11px;
      border-left: 1px solid color-mix(in srgb, var(--category-color) 42%, var(--line));
    }

    .game-kind-group {
      display: grid;
      gap: 3px;
    }

    .game-kind-button,
    .game-genre-button {
      width: 100%;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 6px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .game-kind-button {
      color: color-mix(in srgb, var(--text) 88%, var(--muted));
      font-weight: 700;
    }

    .game-kind-button:hover,
    .game-kind-button.active,
    .game-genre-button:hover,
    .game-genre-button.active {
      color: var(--text);
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.075);
    }

    .game-kind-button.active {
      border-color: color-mix(in srgb, var(--category-color) 52%, var(--line));
      background: color-mix(in srgb, var(--category-color) 12%, transparent);
    }

    .game-kind-button:disabled,
    .game-genre-button:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .game-genre-list {
      display: grid;
      gap: 3px;
      margin-left: 12px;
      padding-left: 9px;
      border-left: 1px solid color-mix(in srgb, var(--category-color) 26%, var(--line));
    }

    .game-genre-button {
      min-height: 34px;
      padding-block: 5px;
      font-size: 0.86rem;
    }

    .game-taxonomy-all {
      margin-bottom: 1px;
    }

    .game-genre-label {
      min-width: 0;
      text-align: left;
      line-height: 1.2;
    }

    .game-genre-count {
      flex: 0 0 auto;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .quick-actions {
      display: grid;
      gap: 8px;
      margin-top: 22px;
    }

    .availability-filter {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .availability-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.045);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.8rem;
      text-align: left;
    }

    .availability-button:hover,
    .availability-button[aria-pressed="true"] {
      color: var(--text);
      border-color: color-mix(in srgb, var(--accent) 62%, var(--line));
      background: color-mix(in srgb, var(--accent) 13%, transparent);
    }

    .availability-count {
      min-width: 23px;
      border-radius: 999px;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.09);
      color: var(--text);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .icon-button,
    .primary-button,
    .ghost-button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .primary-button {
      border-color: rgba(112, 214, 255, 0.46);
      background: linear-gradient(135deg, rgba(112, 214, 255, 0.28), rgba(255, 207, 90, 0.18));
      font-weight: 700;
    }

    :where(.primary-button, .ghost-button, .icon-button):disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .ghost-button:hover,
    .icon-button:hover,
    .primary-button:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .content {
      border-radius: 8px;
      padding: 20px;
      min-width: 0;
    }

    .toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 18px;
    }

    .toolbar > div:first-child {
      min-width: 0;
    }

    .toolbar h2 {
      font-size: clamp(1.6rem, 4vw, 3.4rem);
      line-height: 0.95;
      max-width: 760px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
      max-width: 100%;
      margin-left: auto;
    }

    #popularityButton[aria-pressed="true"] {
      color: #bbf7d0;
      border-color: rgba(74, 222, 128, 0.46);
      background: rgba(74, 222, 128, 0.12);
    }

    .icon-button {
      width: 40px;
      padding: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .app-card {
      min-height: 320px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      color: var(--text);
      background: var(--panel-strong);
      display: grid;
      grid-template-rows: 154px 1fr;
      cursor: pointer;
      text-align: left;
      padding: 0;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
      position: relative;
    }

    .card-select {
      position: absolute;
      inset: 0;
      z-index: 1;
      border: 0;
      border-radius: inherit;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .card-select:focus-visible {
      outline-offset: -4px;
    }

    .app-card:hover,
    .app-card.active {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--accent) 70%, white 10%);
      background: rgba(34, 39, 46, 0.94);
    }

    .app-image {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.42)),
        var(--card-image);
      background-position: center;
      background-size: cover;
      transition: background-image 220ms ease;
    }

    .app-topbar {
      position: absolute;
      inset: 10px 10px auto 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }

    .app-icon {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--accent-2);
      background: rgba(6, 9, 12, 0.82);
      font-weight: 900;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(14px);
    }

    .app-icon svg {
      width: 26px;
      height: 26px;
      display: block;
    }

    .media-dots {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 2;
      display: flex;
      gap: 6px;
      padding: 5px 7px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.56);
      backdrop-filter: blur(14px);
    }

    .media-dot {
      width: 8px;
      height: 8px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: rgba(255, 255, 255, 0.38);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }

    .media-dot:hover,
    .media-dot:focus-visible {
      transform: scale(1.25);
    }

    .media-dot.active {
      background: var(--accent-2);
    }

    .status-pill {
      min-height: 28px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--text);
      background: rgba(0, 0, 0, 0.54);
      font-size: 0.74rem;
      backdrop-filter: blur(14px);
    }

    .status-pill.online {
      color: #bbf7d0;
      border-color: rgba(74, 222, 128, 0.46);
    }

    .status-pill.offline {
      color: #fecdd3;
      border-color: rgba(251, 113, 133, 0.48);
    }

    .status-pill.local {
      color: var(--muted);
    }

    .status-pill.preparing {
      color: #fde68a;
      border-color: rgba(250, 204, 21, 0.46);
      background: rgba(66, 45, 8, 0.62);
    }

    .card-actions {
      position: absolute;
      right: 10px;
      bottom: 10px;
      display: flex;
      gap: 6px;
      z-index: 2;
    }

    .mini-action {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 8px;
      color: var(--text);
      background: rgba(0, 0, 0, 0.54);
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(14px);
    }

    .mini-action.active {
      color: #111;
      background: var(--accent-2);
    }

    .app-body {
      padding: 14px;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .tag {
      width: fit-content;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.77rem;
      overflow-wrap: anywhere;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .popularity-tag {
      color: #bbf7d0;
      border-color: rgba(74, 222, 128, 0.36);
      background: rgba(74, 222, 128, 0.08);
    }

    .new-tag {
      color: #fef3c7;
      border-color: rgba(251, 191, 36, 0.48);
      background: rgba(251, 191, 36, 0.1);
    }

    .pitch {
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .app-card h3 {
      font-size: 1.08rem;
      line-height: 1.15;
    }

    .app-card p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .details {
      padding: 18px;
    }

    .hero-preview {
      aspect-ratio: 16 / 10;
      border-radius: 8px;
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0.42)),
        var(--detail-image);
      background-position: center;
      background-size: cover;
      margin-bottom: 14px;
      transition: background-image 220ms ease;
    }

    .detail-media-controls {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      pointer-events: none;
    }

    .gallery-arrow {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 8px;
      color: var(--text);
      background: rgba(0, 0, 0, 0.58);
      display: grid;
      place-items: center;
      cursor: pointer;
      pointer-events: auto;
      backdrop-filter: blur(14px);
    }

    .detail-media-dots {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      display: flex;
      gap: 7px;
      padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.58);
      pointer-events: auto;
      backdrop-filter: blur(14px);
    }

    .details h2 {
      font-size: 1.45rem;
      margin-bottom: 8px;
    }

    .details p {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .meta-list {
      display: grid;
      gap: 9px;
      margin: 16px 0;
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      padding-bottom: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .meta-item strong {
      color: var(--text);
      font-weight: 600;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .details-actions {
      display: grid;
      grid-template-columns: 1fr 44px;
      gap: 8px;
    }

    body.admin-mode .details-actions {
      grid-template-columns: 1fr 44px 44px 44px;
    }

    .showcase {
      width: min(1040px, calc(100% - 24px));
    }

    .showcase-body {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.65fr);
      gap: 18px;
      padding: 16px;
    }

    .showcase-image {
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.28)),
        var(--showcase-image);
      background-position: center;
      background-size: cover;
    }

    .showcase-copy {
      align-self: center;
      display: grid;
      gap: 14px;
    }

    .admin-only {
      display: none;
    }

    body.admin-mode .admin-only {
      display: inline-flex;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 36px;
      color: var(--muted);
      text-align: center;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    dialog {
      width: min(620px, calc(100% - 24px));
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #171b20;
      box-shadow: var(--shadow);
      padding: 0;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(6px);
    }

    .modal-head,
    .modal-foot {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .modal-foot {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
    }

    .form {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    .field label {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .field input,
    .field select {
      height: 40px;
      padding: 0 10px;
    }

    .field textarea {
      min-height: 92px;
      resize: vertical;
      padding: 10px;
    }

    .insight-dialog {
      width: min(820px, calc(100% - 24px));
      max-height: min(82vh, 760px);
    }

    .insight-body {
      max-height: calc(82vh - 74px);
      overflow: auto;
      padding: 18px;
    }

    .health-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .health-card {
      min-height: 92px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      background: rgba(255, 255, 255, 0.045);
      display: grid;
      align-content: space-between;
      gap: 8px;
    }

    .health-card span {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .health-card strong {
      font-size: 1.55rem;
      font-variant-numeric: tabular-nums;
    }

    .health-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--muted);
    }

    .issue-section,
    .release-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.035);
    }

    .issue-section + .issue-section,
    .release-card + .release-card { margin-top: 10px; }

    .issue-section h3,
    .release-card h3 {
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .issue-list,
    .release-list {
      margin: 0;
      padding-left: 19px;
      color: var(--muted);
      line-height: 1.55;
    }

    .release-timeline {
      position: relative;
      display: grid;
      gap: 10px;
    }

    .release-card {
      display: grid;
      grid-template-columns: minmax(92px, auto) 1fr;
      gap: 14px;
    }

    .release-version {
      color: var(--accent-2);
      font-weight: 800;
    }

    .release-date {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .dialog-empty {
      color: var(--muted);
      text-align: center;
      padding: 28px 10px;
    }

    @media (max-width: 1320px) {
      .shell {
        grid-template-columns: 240px minmax(0, 1fr);
      }

      .details {
        grid-column: 1 / -1;
        position: static;
        max-height: none;
      }
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 20px, 720px);
        grid-template-columns: 1fr;
        padding: 10px 0;
      }

      .sidebar {
        position: static;
        max-height: none;
      }

      .category-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .category-button {
        padding-inline: 9px;
      }

      .game-category-group {
        grid-column: 1 / -1;
      }

      .game-taxonomy-list {
        margin-left: 9px;
      }

      .game-genre-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-left: 6px;
      }

      .game-kind-button,
      .game-genre-button {
        min-height: 42px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar-actions {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        width: 100%;
      }

      .toolbar-actions .ghost-button {
        width: 100%;
      }

      #randomButton,
      #showcaseButton,
      #updatesButton,
      #healthButton {
        grid-column: 1 / -1;
      }

      .health-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .release-card {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .tag-list {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 6px;
        scrollbar-width: thin;
      }

      .tag-filter {
        flex: 0 0 auto;
      }

      .form {
        grid-template-columns: 1fr;
      }

      .showcase-body {
        grid-template-columns: 1fr;
      }

      .showcase-image {
        min-height: 260px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

    const stage = document.getElementById("stage");
    const grid = document.getElementById("appGrid");
    const details = document.getElementById("details");
    const categoryList = document.getElementById("categoryList");
    const tagList = document.getElementById("tagList");
    const availabilityFilter = document.getElementById("availabilityFilter");
    const resultCount = document.getElementById("resultCount");
    const viewTitle = document.getElementById("viewTitle");
    const searchInput = document.getElementById("searchInput");
    const appDialog = document.getElementById("appDialog");
    const appForm = document.getElementById("appForm");
    const showcaseDialog = document.getElementById("showcaseDialog");
    const showcaseBody = document.getElementById("showcaseBody");
    const showcaseTitle = document.getElementById("showcaseTitle");
    const updatesDialog = document.getElementById("updatesDialog");
    const updatesBody = document.getElementById("updatesBody");
    const healthDialog = document.getElementById("healthDialog");
    const healthBody = document.getElementById("healthBody");
    const sortButton = document.getElementById("sortButton");
    const popularityButton = document.getElementById("popularityButton");

    const removedStarterIds = loadRemovedStarterIds();
    let apps = loadApps();
    let favorites = loadFavorites();
    let onlineStatus = {};
    let activeCategory = "Tous";
    let activeGameKind = "Tous";
    let activeGameGenre = "Tous";
    let activeTag = "Tous";
    let activeAvailability = "Tous";
    let selectedId = apps[0]?.id;
    let sortMode = "name";
    let sortAscending = true;
    let popularityLoadPromise = null;
    let popularityLoadedAt = 0;
    let adminMode = false;
    let editingId = null;
    let socialPanelController = null;
    const mediaViewById = new Map();
    const popularityById = new Map();
    const mediaHealthById = new Map();
    let lastHealthCheck = null;
    let healthRefreshPromise = null;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function sanitizeAccent(value) {
      const color = String(value || "").trim();
      return /^#[0-9a-f]{6}$/i.test(color) ? color : "#70d6ff";
    }

    function sanitizeLaunchUrl(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";

      try {
        const url = new URL(raw, document.baseURI);
        return allowedLaunchProtocols.has(url.protocol) ? url.href : "";
      } catch (error) {
        return "";
      }
    }

    function sanitizeImageUrl(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";

      try {
        const url = new URL(raw, document.baseURI);
        const isLocalFile = location.protocol === "file:" && url.protocol === "file:";
        return ["https:", "http:"].includes(url.protocol) || isLocalFile ? url.href : "";
      } catch (error) {
        return "";
      }
    }

    function normalizeApp(app = {}) {
      const source = app && typeof app === "object" ? app : {};
      const fallback = starterApps.find((item) => item.id === source.id) || {};
      const rawTags = Array.isArray(source.tags) ? source.tags : String(source.tags || "").split(",");
      const tags = [...new Set(rawTags.map((tag) => String(tag).trim()).filter(Boolean))].slice(0, 10);
      const rawGallery = Array.isArray(source.gallery) ? source.gallery : (Array.isArray(fallback.gallery) ? fallback.gallery : []);
      const gallery = [...new Set(rawGallery.map(sanitizeImageUrl).filter(Boolean))].slice(0, 10);
      const name = String(source.name || fallback.name || "Application").trim().slice(0, 80);
      const link = sanitizeLaunchUrl(source.link || fallback.link);
      const status = String(source.status || fallback.status || "").trim().slice(0, 40);
      const declaredReleaseState = String(source.releaseState || fallback.releaseState || "").trim().toLowerCase();
      const releaseState = link
        ? "published"
        : declaredReleaseState === "published" || declaredReleaseState === "upcoming"
          ? declaredReleaseState
          : normalizeSearch(status).includes("preparation")
            ? "upcoming"
            : "upcoming";
      const rawAddedAt = String(source.addedAt || fallback.addedAt || "").trim();
      const addedAtTime = Date.parse(rawAddedAt);
      const addedAt = Number.isFinite(addedAtTime) ? new Date(addedAtTime).toISOString() : LEGACY_ADDED_AT;
      return {
        ...fallback,
        ...source,
        id: String(source.id || fallback.id || `app-${Date.now()}`),
        name,
        category: String(source.category || fallback.category || "Autre").trim().slice(0, 40),
        description: String(source.description || fallback.description || "").trim().slice(0, 600),
        pitch: String(source.pitch || fallback.pitch || source.description || fallback.description || "").trim().slice(0, 280),
        gameKind: String(source.gameKind || fallback.gameKind || "").trim().slice(0, 40),
        genre: String(source.genre || fallback.genre || "").trim().slice(0, 60),
        baseGame: String(source.baseGame || fallback.baseGame || "").trim().slice(0, 100),
        tags,
        icon: String(source.icon || fallback.icon || initials(name)).trim().slice(0, 5),
        link,
        presentation: sanitizeImageUrl(source.presentation || fallback.presentation || source.image || fallback.image),
        image: sanitizeImageUrl(source.image || fallback.image),
        gallery,
        accent: sanitizeAccent(source.accent || fallback.accent),
        status,
        releaseState,
        addedAt
      };
    }

    function safeReadArray(key) {
      try {
        const saved = localStorage.getItem(key);
        if (saved === null) return null;
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : null;
      } catch (error) {
        console.warn(`Stockage ignoré pour ${key}:`, error);
        return null;
      }
    }

    function safeWrite(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (error) {
        console.warn(`Impossible d'enregistrer ${key}:`, error);
        return false;
      }
    }

    function loadRemovedStarterIds() {
      return new Set((safeReadArray(removedStarterKey) || []).map(String));
    }

    function loadApps() {
      const saved = safeReadArray(storeKey);
      if (!saved) return starterApps.map(normalizeApp);

      const starterById = new Map(starterApps.map((starter) => [String(starter.id), starter]));
      const loaded = saved
        .filter((app) => app && typeof app === "object")
        .map((savedApp) => {
          const starter = starterById.get(String(savedApp.id));
          if (!starter) return normalizeApp(savedApp);
          const synchronized = { ...savedApp };
          OFFICIAL_SYNC_FIELDS.forEach((field) => {
            synchronized[field] = starter[field] ?? "";
          });
          return normalizeApp(synchronized);
        });
      const knownIds = new Set(loaded.map((app) => app.id));
      starterApps.forEach((starter) => {
        if (!knownIds.has(starter.id) && !removedStarterIds.has(starter.id)) {
          loaded.push(normalizeApp(starter));
        }
      });
      return loaded;
    }

    function loadFavorites() {
      const appIds = new Set(apps.map((app) => app.id));
      return new Set((safeReadArray(favoriteKey) || []).map(String).filter((id) => appIds.has(id)));
    }

    function saveApps() {
      safeWrite(storeKey, apps);
    }

    function saveFavorites() {
      safeWrite(favoriteKey, [...favorites]);
    }

    function saveRemovedStarterIds() {
      safeWrite(removedStarterKey, [...removedStarterIds]);
    }

    function initials(name) {
      return String(name)
        .split(/\s+/)
        .slice(0, 2)
        .map((word) => word[0]?.toUpperCase() || "")
        .join("") || "AP";
    }

    function mediaImages(app) {
      const images = [
        sanitizeImageUrl(app.presentation),
        sanitizeImageUrl(app.image),
        ...(Array.isArray(app.gallery) ? app.gallery.map(sanitizeImageUrl) : [])
      ].filter(Boolean);
      return images.filter((image, index) => images.indexOf(image) === index);
    }

    function mediaLabel(index) {
      if (index === 0) return "Illustration";
      if (index === 1) return "Capture d'écran";
      return `Vue ${index}`;
    }

    function currentMediaIndex(app) {
      const images = mediaImages(app);
      return Math.min(mediaViewById.get(app.id) || 0, Math.max(images.length - 1, 0));
    }

    function cssImage(app, index = currentMediaIndex(app)) {
      const image = mediaImages(app)[index];
      if (image) {
        return `url(${JSON.stringify(image)})`;
      }

      return `linear-gradient(135deg, ${sanitizeAccent(app.accent)}, #232a31 52%, #101214)`;
    }

    function appIconMarkup(app) {
      if (!appIconIds.has(app.id)) return escapeHtml(app.icon);
      const href = `assets/app-icons.svg#icon-${app.id}`;
      return `<svg aria-hidden="true" focusable="false"><use href="${escapeHtml(href)}"></use></svg>`;
    }

    function availabilityFor(app) {
      return app?.releaseState === "published" || Boolean(app?.link)
        ? "Disponible"
        : "En préparation";
    }

    function isNewApp(app, now = Date.now(), windowDays = NEW_APP_WINDOW_DAYS) {
      const addedAt = Date.parse(app?.addedAt || "");
      if (!Number.isFinite(addedAt)) return false;
      const elapsed = now - addedAt;
      return elapsed >= 0 && elapsed <= windowDays * 24 * 60 * 60 * 1000;
    }

    function visibleTags(app) {
      return (app?.tags || []).filter((tag) => (
        availabilityFor(app) !== "Disponible" ||
        normalizeSearch(tag) !== "en preparation"
      ));
    }

    function statusLabel(app) {
      if (availabilityFor(app) === "En préparation") return "En préparation";
      const state = onlineStatus[app.id];
      if (state === "online") return "Joignable";
      if (state === "offline") return "Injoignable";
      if (!app.link) return "Sans lien";
      if (!/^https?:/i.test(app.link)) return "Lien local";
      return "Vérification...";
    }

    function statusClass(app) {
      if (availabilityFor(app) === "En préparation") return "preparing";
      if (onlineStatus[app.id]) return onlineStatus[app.id];
      return /^https?:/i.test(app.link) ? "checking" : "local";
    }

    function normalizeSearch(value) {
      return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function allTags() {
      return [...new Set(apps.flatMap(visibleTags))].sort((a, b) => a.localeCompare(b));
    }

    function popularityCount(appId) {
      const count = Number(popularityById.get(appId));
      return Number.isFinite(count) && count > 0 ? Math.floor(count) : 0;
    }

    function popularityLabel(appId) {
      const count = popularityCount(appId);
      return `${count.toLocaleString("fr-FR")} ouverture${count === 1 ? "" : "s"}`;
    }

    function updateSortControls() {
      const popularityActive = sortMode === "popularity";
      const popularityLoading = Boolean(popularityLoadPromise);
      const nameLabel = popularityActive
        ? `Revenir au tri par nom, ordre ${sortAscending ? "croissant" : "décroissant"}`
        : `Trier par nom, ordre ${sortAscending ? "croissant" : "décroissant"}`;
      const popularityControlLabel = popularityActive
        ? "Désactiver le tri par popularité"
        : "Trier par popularité selon les ouvertures";

      sortButton.title = nameLabel;
      sortButton.setAttribute("aria-label", nameLabel);
      popularityButton.textContent = popularityLoading ? "Popularité…" : "Popularité";
      popularityButton.title = popularityControlLabel;
      popularityButton.setAttribute("aria-label", popularityControlLabel);
      popularityButton.setAttribute("aria-pressed", String(popularityActive));
      popularityButton.setAttribute("aria-busy", String(popularityLoading));
    }

    function loadPopularityStats() {
      if (popularityLoadPromise) return popularityLoadPromise;

      const appIds = [...new Set(apps.map((app) => app.id))];
      const cacheIsFresh =
        Date.now() - popularityLoadedAt < POPULARITY_REFRESH_INTERVAL_MS &&
        appIds.every((appId) => popularityById.has(appId));

      if (cacheIsFresh) return Promise.resolve();

      if (!window.LauncherSocial || typeof window.LauncherSocial.getVisitCount !== "function") {
        appIds.forEach((appId) => {
          if (!popularityById.has(appId)) popularityById.set(appId, 0);
        });
        popularityLoadedAt = Date.now();
        return Promise.resolve();
      }

      const queue = [...appIds];
      const worker = async () => {
        while (queue.length) {
          const appId = queue.shift();
          try {
            const count = await window.LauncherSocial.getVisitCount(appId);
            const numericCount = Number(count);
            popularityById.set(
              appId,
              Number.isFinite(numericCount) && numericCount > 0
                ? Math.floor(numericCount)
                : 0
            );
          } catch {
            if (!popularityById.has(appId)) popularityById.set(appId, 0);
          }
        }
      };

      const workerCount = Math.min(POPULARITY_WORKER_COUNT, queue.length);
      popularityLoadPromise = Promise.all(
        Array.from({ length: workerCount }, () => worker())
      )
        .then(() => {
          popularityLoadedAt = Date.now();
        })
        .finally(() => {
          popularityLoadPromise = null;
          updateSortControls();
          if (sortMode === "popularity") renderGrid();
        });

      updateSortControls();
      return popularityLoadPromise;
    }

    function filteredApps() {
      const query = normalizeSearch(searchInput.value.trim());
      return apps
        .filter((app) => activeCategory === "Tous" || (activeCategory === "Favoris" ? favorites.has(app.id) : app.category === activeCategory))
        .filter((app) => activeCategory !== "Jeux" || activeGameKind === "Tous" || gameKindFor(app) === activeGameKind)
        .filter((app) => activeCategory !== "Jeux" || activeGameGenre === "Tous" || gameGenreFor(app) === activeGameGenre)
        .filter((app) => activeTag === "Tous" || visibleTags(app).includes(activeTag))
        .filter((app) => (
          activeAvailability === "Tous" ||
          (activeAvailability === "Nouveauté" ? isNewApp(app) : availabilityFor(app) === activeAvailability)
        ))
        .filter((app) => {
          const haystack = normalizeSearch(`${app.name} ${app.category} ${gameKindLabel(gameKindFor(app))} ${gameGenreFor(app)} ${gameBaseFor(app)} ${app.description} ${app.pitch} ${app.status} ${(app.tags || []).join(" ")}`);
          return haystack.includes(query);
        })
        .sort((a, b) => {
          if (sortMode === "popularity") {
            const popularityDelta = popularityCount(b.id) - popularityCount(a.id);
            if (popularityDelta) return popularityDelta;
          }
          const favDelta = Number(favorites.has(b.id)) - Number(favorites.has(a.id));
          if (favDelta) return favDelta;
          return sortAscending ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
        });
    }

    function gameKindFor(app) {
      if (app?.category !== "Jeux") return "";
      const declaredKind = normalizeSearch(app.gameKind || "");
      if (declaredKind === "fan games" || declaredKind === "fan game" || declaredKind === "fangames" || declaredKind === "fangame") {
        return "Fan games";
      }
      if (declaredKind === "jeux originaux" || declaredKind === "jeu original" || declaredKind === "jeux de base" || declaredKind === "jeu de base") {
        return "Jeux originaux";
      }
      return EXISTING_FAN_GAME_BASES.has(app.id) ? "Fan games" : "Jeux originaux";
    }

    function gameKindLabel(kind) {
      return kind === "Fan games" ? "Fan-games" : kind;
    }

    function gameGenreFor(app) {
      if (app?.category !== "Jeux") return "";
      const declaredGenre = GAME_GENRE_GROUPS.find((group) => normalizeSearch(group.name) === normalizeSearch(app.genre || ""))?.name;
      return declaredGenre || gameGenreById.get(app.id) || "Aventure & exploration";
    }

    function gameBaseFor(app) {
      if (gameKindFor(app) !== "Fan games") return "";
      return String(app.baseGame || EXISTING_FAN_GAME_BASES.get(app.id) || "").trim();
    }

    function gameTaxonomyTagsMarkup(app) {
      if (app?.category !== "Jeux") return "";
      const baseGame = gameBaseFor(app);
      return `
        <span class="tag">${escapeHtml(gameKindLabel(gameKindFor(app)))}</span>
        <span class="tag">${escapeHtml(gameGenreFor(app))}</span>
        ${baseGame ? `<span class="tag">Base : ${escapeHtml(baseGame)}</span>` : ""}
      `;
    }

    function gameTaxonomyMetaMarkup(app) {
      if (app?.category !== "Jeux") return "";
      const baseGame = gameBaseFor(app);
      return `
        <div class="meta-item"><span>Type de jeu</span><strong>${escapeHtml(gameKindLabel(gameKindFor(app)))}</strong></div>
        <div class="meta-item"><span>Genre</span><strong>${escapeHtml(gameGenreFor(app))}</strong></div>
        ${baseGame ? `<div class="meta-item"><span>Jeu / univers de base</span><strong>${escapeHtml(baseGame)}</strong></div>` : ""}
      `;
    }

    function activeGameViewTitle() {
      const titleParts = ["Jeux"];
      if (activeGameKind !== "Tous") titleParts.push(gameKindLabel(activeGameKind));
      if (activeGameGenre !== "Tous") titleParts.push(activeGameGenre);
      return titleParts.join(" · ");
    }

    function gameTaxonomyCounts() {
      const initialCounts = {
        total: 0,
        byKind: Object.fromEntries(GAME_KINDS.map((kind) => [kind, {
          total: 0,
          byGenre: Object.fromEntries(GAME_GENRE_GROUPS.map((group) => [group.name, 0]))
        }]))
      };

      return apps.reduce((counts, app) => {
        if (app.category !== "Jeux") return counts;
        const kind = gameKindFor(app);
        const genre = gameGenreFor(app);
        counts.total += 1;
        counts.byKind[kind].total += 1;
        counts.byKind[kind].byGenre[genre] += 1;
        return counts;
      }, initialCounts);
    }

    function updateGameTaxonomyControls() {
      categoryList.querySelectorAll("[data-game-kind]").forEach((button) => {
        const active = button.dataset.gameKind === activeGameKind && button.dataset.gameGenre === activeGameGenre;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    }

    function renderCategories() {
      if (
        activeCategory === "Jeux" &&
        (
          (activeGameKind !== "Tous" && !GAME_KINDS.includes(activeGameKind)) ||
          (activeGameGenre !== "Tous" && !GAME_GENRE_NAMES.has(activeGameGenre)) ||
          (activeGameKind !== "Tous" && activeGameGenre !== "Tous" && !apps.some((app) => (
            app.category === "Jeux" &&
            gameKindFor(app) === activeGameKind &&
            gameGenreFor(app) === activeGameGenre
          )))
        )
      ) {
        activeGameKind = "Tous";
        activeGameGenre = "Tous";
      }

      const counts = apps.reduce((acc, app) => {
        acc[app.category] = (acc[app.category] || 0) + 1;
        return acc;
      }, { Tous: apps.length, Favoris: favorites.size });

      const categories = ["Tous", "Favoris", ...Object.keys(counts).filter((item) => !["Tous", "Favoris"].includes(item)).sort()];
      const taxonomyCounts = gameTaxonomyCounts();

      categoryList.innerHTML = categories.map((category) => {
        const active = category === activeCategory;
        const gameCategoryAttributes = category === "Jeux"
          ? ` aria-expanded="${active}"${active ? ' aria-controls="gameTaxonomyList"' : ""}`
          : "";
        const categoryButton = `
        <button class="category-button ${active ? "active" : ""}" type="button" data-category="${escapeHtml(category)}" aria-pressed="${active}"${gameCategoryAttributes} style="--category-color: ${categoryColors[category] || categoryColors.Autre}">
          <span class="category-meta">
            <span class="category-dot"></span>
            <span>${escapeHtml(category)}</span>
          </span>
          <span class="category-count">${counts[category] || 0}</span>
        </button>
        `;

        if (category !== "Jeux" || !active) return categoryButton;

        const allGamesActive = activeGameKind === "Tous" && activeGameGenre === "Tous";
        const allGamesButton = `
          <button class="game-kind-button game-taxonomy-all ${allGamesActive ? "active" : ""}" type="button" data-game-kind="Tous" data-game-genre="Tous" aria-pressed="${allGamesActive}" aria-label="${escapeHtml(`Tous les jeux, ${taxonomyCounts.total} jeux`)}">
            <span class="game-genre-label">Tous les jeux</span>
            <span class="game-genre-count">${taxonomyCounts.total}</span>
          </button>
        `;

        const kindGroups = GAME_KINDS.map((kind, kindIndex) => {
          const kindCounts = taxonomyCounts.byKind[kind];
          const kindActive = activeGameKind === kind && activeGameGenre === "Tous";
          const kindLabel = gameKindLabel(kind);
          const genreListId = `gameGenreList-${kindIndex}`;
          const genreButtons = GAME_GENRE_GROUPS.map((group) => {
            const genre = group.name;
            const genreActive = activeGameKind === kind && activeGameGenre === genre;
            const count = kindCounts.byGenre[genre];
            const countLabel = `${count} jeu${count > 1 ? "x" : ""}`;
            return `
              <button class="game-genre-button ${genreActive ? "active" : ""}" type="button" data-game-kind="${escapeHtml(kind)}" data-game-genre="${escapeHtml(genre)}" aria-pressed="${genreActive}" aria-label="${escapeHtml(`${kindLabel}, ${genre}, ${countLabel}`)}" ${count ? "" : "disabled"}>
                <span class="game-genre-label">${escapeHtml(genre)}</span>
                <span class="game-genre-count">${count}</span>
              </button>
            `;
          }).join("");

          return `
            <div class="game-kind-group">
              <button class="game-kind-button ${kindActive ? "active" : ""}" type="button" data-game-kind="${escapeHtml(kind)}" data-game-genre="Tous" aria-pressed="${kindActive}" aria-expanded="true" aria-controls="${genreListId}" aria-label="${escapeHtml(`${kindLabel}, ${kindCounts.total} jeux`)}">
                <span class="game-genre-label">${escapeHtml(kindLabel)}</span>
                <span class="game-genre-count">${kindCounts.total}</span>
              </button>
              <div class="game-genre-list" id="${genreListId}" role="group" aria-label="Genres de ${escapeHtml(kindLabel)}">
                ${genreButtons}
              </div>
            </div>
          `;
        }).join("");

        return `
          <div class="category-group game-category-group" style="--category-color: ${categoryColors.Jeux}">
            ${categoryButton}
            <div class="game-taxonomy-list" id="gameTaxonomyList" role="group" aria-label="Types et genres de jeux">
              ${allGamesButton}
              ${kindGroups}
            </div>
          </div>
        `;
      }).join("");
    }

    function renderTags() {
      const tags = ["Tous", ...allTags()];
      if (!tags.includes(activeTag)) activeTag = "Tous";
      tagList.innerHTML = tags.map((tag) => `
        <button class="tag-filter ${tag === activeTag ? "active" : ""}" type="button" data-tag="${escapeHtml(tag)}" aria-pressed="${tag === activeTag}">${escapeHtml(tag)}</button>
      `).join("");
    }

    function renderAvailabilityFilters() {
      const counts = {
        Tous: apps.length,
        Disponible: apps.filter((app) => availabilityFor(app) === "Disponible").length,
        "En préparation": apps.filter((app) => availabilityFor(app) === "En préparation").length,
        Nouveauté: apps.filter((app) => isNewApp(app)).length
      };
      availabilityFilter.innerHTML = AVAILABILITY_FILTERS.map((filter) => {
        const active = filter === activeAvailability;
        const detail = filter === "Nouveauté" ? ` des ${NEW_APP_WINDOW_DAYS} derniers jours` : "";
        return `
          <button
            class="availability-button"
            type="button"
            data-availability="${escapeHtml(filter)}"
            aria-pressed="${active}"
            aria-label="${escapeHtml(`${filter}${detail}, ${counts[filter]} application${counts[filter] > 1 ? "s" : ""}`)}"
          >
            <span>${escapeHtml(filter)}</span>
            <span class="availability-count" aria-hidden="true">${counts[filter]}</span>
          </button>
        `;
      }).join("");
    }

    function renderGrid() {
      const visibleApps = filteredApps();
      const popularityStatus = sortMode === "popularity"
        ? popularityLoadPromise
          ? " · chargement de la popularité"
          : " · tri par popularité"
        : "";
      const availabilityStatus = activeAvailability === "Tous" ? "" : ` · ${activeAvailability.toLowerCase()}`;
      resultCount.textContent = `${visibleApps.length} application${visibleApps.length > 1 ? "s" : ""}${availabilityStatus}${popularityStatus}`;
      const baseViewTitle = activeCategory === "Tous"
        ? "Toutes tes applications"
        : activeCategory === "Jeux"
          ? activeGameViewTitle()
          : activeCategory;
      viewTitle.textContent = activeAvailability === "Tous"
        ? baseViewTitle

    function mediaTargets(app) {
      const targets = [
        { label: "Illustration", url: sanitizeImageUrl(app.presentation) },
        { label: "Capture", url: sanitizeImageUrl(app.image) },
        ...(Array.isArray(app.gallery) ? app.gallery.map((url, index) => ({
          label: `Galerie ${index + 1}`,
          url: sanitizeImageUrl(url)
        })) : [])
      ];
      const seen = new Set();
      return targets.filter((target) => {
        if (!target.url || seen.has(target.url)) return false;
        seen.add(target.url);
        return true;
      });
    }

    function isSameOriginHttp(url) {
      try {
        const parsed = new URL(url, document.baseURI);
        return ["http:", "https:"].includes(parsed.protocol) && parsed.origin === location.origin;
      } catch (error) {
        return false;
      }
    }

    async function probeMediaHead(url) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      try {
        const response = await fetch(url, {
          method: "HEAD",
          cache: "no-store",
          signal: controller.signal
        });
        return response.ok;
      } catch (error) {
        return false;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function checkMediaHealth() {
      const queue = [];
      mediaHealthById.clear();
      apps.forEach((app) => {
        const targets = mediaTargets(app);
        const missing = [];
        if (!sanitizeImageUrl(app.presentation)) missing.push("Illustration absente");
        if (!sanitizeImageUrl(app.image)) missing.push("Capture absente");
        mediaHealthById.set(app.id, { missing, checked: false });
        targets.filter((target) => isSameOriginHttp(target.url)).forEach((target) => {
          queue.push({ appId: app.id, ...target });
        });
      });

      async function worker() {
        while (queue.length) {
          const target = queue.shift();
          if (!target) return;
          const available = await probeMediaHead(target.url);
          if (!available) {
            const entry = mediaHealthById.get(target.appId);
            entry?.missing.push(`${target.label} introuvable`);
          }
        }
      }

      const workerCount = Math.min(MEDIA_HEALTH_WORKER_COUNT, queue.length);
      await Promise.all(Array.from({ length: workerCount }, () => worker()));
      mediaHealthById.forEach((entry) => {
        entry.checked = true;
        entry.missing = [...new Set(entry.missing)];
      });
    }

    function healthSnapshot() {
      const published = apps.filter((app) => availabilityFor(app) === "Disponible");
      const upcoming = apps.filter((app) => availabilityFor(app) === "En préparation");
      const reachable = published.filter((app) => onlineStatus[app.id] === "online").length;
      const offlineApps = published.filter((app) => onlineStatus[app.id] === "offline");
      const mediaIssues = apps
        .map((app) => ({ app, missing: mediaHealthById.get(app.id)?.missing || [] }))
        .filter((item) => item.missing.length);
      return { published, upcoming, reachable, offlineApps, mediaIssues };
    }

    function updateHealthButton() {
      const { offlineApps, mediaIssues } = healthSnapshot();
      const issueCount = offlineApps.length + mediaIssues.length;
      const label = issueCount ? `Santé du catalogue · ${issueCount}` : "Santé du catalogue";
      document.getElementById("healthButton").textContent = label;
      document.getElementById("healthButton").setAttribute(
        "aria-label",
        issueCount ? `Santé du catalogue, ${issueCount} problème${issueCount > 1 ? "s" : ""}` : label
      );
    }

    function renderHealthDashboard({ busy = Boolean(healthRefreshPromise) } = {}) {
      const { published, upcoming, reachable, offlineApps, mediaIssues } = healthSnapshot();
      const lastCheck = lastHealthCheck
        ? new Intl.DateTimeFormat("fr-FR", { dateStyle: "medium", timeStyle: "short" }).format(lastHealthCheck)
        : "Jamais";
      const offlineMarkup = offlineApps.length
        ? `<ul class="issue-list">${offlineApps.map((app) => `<li>${escapeHtml(app.name)}</li>`).join("")}</ul>`
        : '<p class="subtitle">Aucun jeu publié détecté hors ligne.</p>';
      const mediaMarkup = mediaIssues.length
        ? `<ul class="issue-list">${mediaIssues.map(({ app, missing }) => `<li><strong>${escapeHtml(app.name)}</strong> — ${escapeHtml(missing.join(", "))}</li>`).join("")}</ul>`
        : `<p class="subtitle">${mediaHealthById.size ? "Aucun média manquant détecté." : "Le scan des médias démarrera à l’ouverture de ce tableau."}</p>`;

      healthBody.innerHTML = `
        <div class="health-summary" aria-label="Résumé de santé">
          <div class="health-card"><span>Publiés</span><strong>${published.length}</strong></div>
          <div class="health-card"><span>En préparation</span><strong>${upcoming.length}</strong></div>
          <div class="health-card"><span>Joignables</span><strong>${reachable}</strong></div>
          <div class="health-card"><span>Hors ligne</span><strong>${offlineApps.length}</strong></div>
          <div class="health-card"><span>Médias manquants</span><strong>${mediaIssues.length}</strong></div>
        </div>
        <div class="health-meta">
          <span>Dernière vérification : <strong>${escapeHtml(lastCheck)}</strong></span>
          <button class="ghost-button" id="refreshHealthButton" type="button" aria-busy="${busy}" ${busy ? "disabled" : ""}>
            ${busy ? "Vérification…" : "Actualiser"}
          </button>
        </div>
        <section class="issue-section" aria-labelledby="offlineIssuesTitle">
          <h3 id="offlineIssuesTitle">Jeux et applications hors ligne</h3>
          ${offlineMarkup}
        </section>
        <section class="issue-section" aria-labelledby="mediaIssuesTitle">
          <h3 id="mediaIssuesTitle">Médias manquants</h3>
          ${mediaMarkup}
        </section>
      `;
      updateHealthButton();
    }

    async function refreshHealthDashboard() {
      if (healthRefreshPromise) return healthRefreshPromise;
      healthRefreshPromise = Promise.all([checkOnlineStatus(), checkMediaHealth()])
        .then(() => {
          lastHealthCheck = new Date();
        })
        .finally(() => {
          healthRefreshPromise = null;
          renderHealthDashboard({ busy: false });
        });
      renderHealthDashboard({ busy: true });
      return healthRefreshPromise;
    }

    async function loadAppGallery() {
      try {
        const response = await fetch("assets/app-gallery.json", { cache: "no-cache" });
        if (!response.ok) return;
        const data = await response.json();
        const galleryMap = data.galleries || data.apps || data;
        if (!galleryMap || typeof galleryMap !== "object") return;

        apps = apps.map((app) => {
          const entry = galleryMap[app.id];
          const rawImages = Array.isArray(entry) ? entry : entry?.images;
          if (!Array.isArray(rawImages)) return app;
          const gallery = [...new Set(rawImages.map(sanitizeImageUrl).filter(Boolean))].slice(0, 10);
          return { ...app, gallery };
        });
        renderGrid();
      } catch (error) {
        console.warn("Galeries supplémentaires indisponibles:", error);
      }
    }

    async function checkOnlineStatus() {
      const webApps = apps.filter((app) => (
        availabilityFor(app) === "Disponible" && /^https?:/i.test(app.link)
      ));
      apps.forEach((app) => {
        onlineStatus[app.id] = availabilityFor(app) === "En préparation"
          ? "preparing"
          : /^https?:/i.test(app.link)
            ? "checking"
            : "local";
      });
      renderGrid();

      await Promise.allSettled(webApps.map(async (app) => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 6000);
        try {
          await fetch(app.link, { mode: "no-cors", cache: "no-store", signal: controller.signal });
          onlineStatus[app.id] = "online";
        } catch (error) {
          onlineStatus[app.id] = "offline";
        } finally {
          clearTimeout(timeout);
        }
      }));
      lastHealthCheck = new Date();
      renderGrid();
      updateHealthButton();
      if (healthDialog.open) renderHealthDashboard();
    }

    });

    grid.addEventListener("focusin", (event) => {
      const card = event.target.closest(".app-card");
      if (!card) return;
      const app = apps.find((item) => item.id === card.dataset.id);
      if (app) document.documentElement.style.setProperty("--active-image", cssImage(app));
    });

    grid.addEventListener("mouseleave", () => {
      const selectedApp = apps.find((app) => app.id === selectedId);
      if (selectedApp) document.documentElement.style.setProperty("--active-image", cssImage(selectedApp));
    });

    grid.addEventListener("click", (event) => {
      const actionButton = event.target.closest("[data-action]");
      if (actionButton) {
        event.stopPropagation();
        const app = apps.find((item) => item.id === actionButton.dataset.id);
        if (!app) return;
        if (actionButton.dataset.action === "media") {
          mediaViewById.set(app.id, Number(actionButton.dataset.index) || 0);
          renderGrid();
          return;
        }
        if (actionButton.dataset.action === "favorite") toggleFavorite(app.id);
        if (actionButton.dataset.action === "edit") openEditor(app);
        if (actionButton.dataset.action === "select") selectApp(app.id, true);
        return;
      }
    });

    grid.addEventListener("keydown", (event) => {
      const selectButton = event.target.closest('[data-action="select"]');
      if (!selectButton || !["Enter", " "].includes(event.key)) return;
      event.preventDefault();
      selectApp(selectButton.dataset.id, true);
    });

    details.addEventListener("click", (event) => {
      const selectedApp = apps.find((app) => app.id === selectedId);
      const mediaButton = event.target.closest("[data-detail-media]");
      if (mediaButton && selectedApp) {
        mediaViewById.set(selectedApp.id, Number(mediaButton.dataset.detailMedia) || 0);
        renderGrid();
        return;
      }
      if (event.target.closest("#detailFavoriteButton") && selectedApp) {
        toggleFavorite(selectedApp.id);
        return;
      }
      if (event.target.closest("#editButton") && selectedApp) {
        openEditor(selectedApp);
        return;
      }
      const deleteButton = event.target.closest("#deleteButton");
      if (!deleteButton || !selectedId) return;
      const deletedApp = apps.find((app) => app.id === selectedId);
      if (!deletedApp || !window.confirm(`Supprimer ${deletedApp.name} du launcher ?`)) return;
      const deletedId = selectedId;
      apps = apps.filter((app) => app.id !== selectedId);
      favorites.delete(deletedId);
      delete onlineStatus[deletedId];
      mediaHealthById.delete(deletedId);
      if (starterApps.some((app) => app.id === deletedId)) {
        removedStarterIds.add(deletedId);
        saveRemovedStarterIds();
      }
      selectedId = apps[0]?.id;
      saveApps();
      saveFavorites();
      render();
    });

    document.addEventListener("click", (event) => {
      const launchLink = event.target.closest("[data-launch-app]");
      if (
        !launchLink ||
        !window.LauncherSocial ||
        typeof window.LauncherSocial.recordVisit !== "function"
      ) return;

      const appId = launchLink.dataset.launchApp;
      window.LauncherSocial.recordVisit(appId)
        .then((count) => {
          const numericCount = Number(count);
          popularityById.set(
            appId,
            Number.isFinite(numericCount) && numericCount > 0
              ? Math.floor(numericCount)
              : 0
          );
          if (sortMode === "popularity") renderGrid();
        })
        .catch(() => {});
    });

    searchInput.addEventListener("input", renderGrid);

    sortButton.addEventListener("click", () => {
      if (sortMode === "name") {
        sortAscending = !sortAscending;
      } else {
        sortMode = "name";
      }
      updateSortControls();
      renderGrid();
    });

    popularityButton.addEventListener("click", () => {
      sortMode = sortMode === "popularity" ? "name" : "popularity";
      if (sortMode === "popularity") loadPopularityStats();
      updateSortControls();
      renderGrid();
    });

    document.getElementById("randomButton").addEventListener("click", () => {
      const visibleApps = filteredApps();
      const randomApp = visibleApps[Math.floor(Math.random() * visibleApps.length)];
      if (!randomApp) return;
      selectApp(randomApp.id, true);
    });

    document.getElementById("showcaseButton").addEventListener("click", () => renderShowcase());
    document.getElementById("closeShowcaseButton").addEventListener("click", () => showcaseDialog.close());
    document.getElementById("updatesButton").addEventListener("click", () => {
      renderUpdates();
      updatesDialog.showModal();
    });
    document.getElementById("closeUpdatesButton").addEventListener("click", () => updatesDialog.close());
    document.getElementById("healthButton").addEventListener("click", () => {
      renderHealthDashboard();
      healthDialog.showModal();
      if (!mediaHealthById.size) refreshHealthDashboard();
    });
    document.getElementById("closeHealthButton").addEventListener("click", () => healthDialog.close());
    healthBody.addEventListener("click", (event) => {
      if (event.target.closest("#refreshHealthButton")) refreshHealthDashboard();
    });
    document.getElementById("closeAppDialogButton").addEventListener("click", () => appDialog.close());
    document.getElementById("cancelAppButton").addEventListener("click", () => appDialog.close());

    document.getElementById("addButton").addEventListener("click", () => openEditor());

    document.getElementById("adminButton").addEventListener("click", (event) => {
      adminMode = !adminMode;
      event.currentTarget.textContent = adminMode ? "Quitter l'édition" : "Mode édition";
      event.currentTarget.setAttribute("aria-pressed", String(adminMode));
      render();
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      if (!window.confirm("Restaurer le catalogue d'origine ? Les ajouts, modifications et favoris locaux seront supprimés.")) return;
      apps = starterApps.map(normalizeApp);
      favorites.clear();
      removedStarterIds.clear();
      onlineStatus = {};
      mediaHealthById.clear();
      lastHealthCheck = null;
      selectedId = apps[0]?.id;
      activeCategory = "Tous";
      activeGameKind = "Tous";
      activeGameGenre = "Tous";
      activeTag = "Tous";
      activeAvailability = "Tous";
      searchInput.value = "";
      sortMode = "name";
      sortAscending = true;
      saveApps();
      saveFavorites();
      saveRemovedStarterIds();
      render();
      checkOnlineStatus();
    });

    appForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const formData = new FormData(appForm);
      const name = String(formData.get("name")).trim();
      const description = String(formData.get("description")).trim();
      const rawLink = String(formData.get("link")).trim();
      const rawPresentation = String(formData.get("presentation")).trim();
      const rawImage = String(formData.get("image")).trim();
      const nameField = document.getElementById("nameField");
      const descriptionField = document.getElementById("descriptionField");
      const linkField = document.getElementById("linkField");
      const presentationField = document.getElementById("presentationField");
      const imageField = document.getElementById("imageField");

      nameField.setCustomValidity(name ? "" : "Saisis un nom.");
      descriptionField.setCustomValidity(description ? "" : "Saisis une description.");
      linkField.setCustomValidity(rawLink && !sanitizeLaunchUrl(rawLink) ? "Utilise un lien http, https, steam ou file valide." : "");
      presentationField.setCustomValidity(rawPresentation && !sanitizeImageUrl(rawPresentation) ? "Utilise une image http, https ou un chemin relatif valide." : "");
      imageField.setCustomValidity(rawImage && !sanitizeImageUrl(rawImage) ? "Utilise une image http, https ou un chemin relatif valide." : "");
      if (!appForm.checkValidity()) {
        appForm.reportValidity();
        return;
      }

      const slug = normalizeSearch(name).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "application";
      const app = normalizeApp({
        id: editingId || `${Date.now()}-${slug}`,
        name,
        category: String(formData.get("category")).trim() || "Autre",
        description,
        pitch: String(formData.get("pitch")).trim(),
        link: rawLink,
        presentation: rawPresentation,
        image: rawImage,
        icon: String(formData.get("icon")).trim(),
        tags: String(formData.get("tags")).split(",").map((tag) => tag.trim()).filter(Boolean),
        accent: String(formData.get("accent")).trim() || "#70d6ff",
        status: String(formData.get("status")).trim(),
        releaseState: rawLink ? "published" : "upcoming",
        addedAt: editingId
          ? apps.find((item) => item.id === editingId)?.addedAt || new Date().toISOString()
          : new Date().toISOString()
      });

      apps = editingId ? apps.map((item) => item.id === editingId ? app : item) : [app, ...apps];
      mediaHealthById.clear();
      selectedId = app.id;
      activeCategory = "Tous";
      activeGameKind = "Tous";
      activeGameGenre = "Tous";
      activeTag = "Tous";
      activeAvailability = "Tous";
      editingId = null;
      saveApps();
      appDialog.close();
      render();
      checkOnlineStatus();
    });

    ["nameField", "descriptionField", "linkField", "presentationField", "imageField"].forEach((id) => {
      document.getElementById(id).addEventListener("input", (event) => event.currentTarget.setCustomValidity(""));
    });

    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });

    render();
    renderUpdates();
    renderHealthDashboard();
    loadAppGallery();
    checkOnlineStatus();

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch((error) => console.warn("Service worker indisponible:", error)));
    }
  </script>
</body>
</html>
