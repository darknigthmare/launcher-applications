name: Launcher — capture native Shadow Codec Ops 3.10

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Recapturer Shadow Codec uniquement sur autorisation"
        required: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: launcher-shadow-codec-live-capture
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref_name == 'codex/launcher-links-media-fidelity-20261101' && inputs.acknowledge == true
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Get current PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Chrome native capture
        run: |
          node --check scripts/browser-capture-common.mjs
          node --check scripts/capture-shadow-codec.mjs
      - name: Capture 3.10 live modules and Phaser scene from production
        run: node scripts/capture-shadow-codec.mjs
      - name: Audit updated launcher and archive consistency
        run: npm test
      - name: Keep five evidence screenshots as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-codec-native-${{ github.run_number }}
          path: |
            docs/media-proof/shadow-codec-3100-modules-2026-11-01.json
            assets/screenshots/shadow-codec-ops/*.png
            assets/previews/shadow-codec-ops.jpg
          if-no-files-found: warn
      - name: Commit true screenshots and archived originals
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/shadow-codec-ops assets/screenshots/previous/shadow-codec-ops \
            assets/previews/shadow-codec-ops.jpg assets/previews/previous/shadow-codec-ops.jpg \
            assets/app-gallery.json assets/app-gallery-admin.json \
            docs/MEDIA_FIDELITY_MATRIX_2026-11-01.json docs/media-proof/shadow-codec-3100-modules-2026-11-01.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media(shadow-codec): update five 3.10 native module screens and preserve prior captures"
          git push origin "HEAD:${{ github.ref_name }}"
