name: Launcher — retrouver le vrai menu Resident Evil B.O.W.

on:
  pull_request:
    paths:
      - "scripts/capture-recovered-bow.mjs"
      - ".github/workflows/capture-recovered-bow.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-resident-evil-bow-native-menu
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/launcher-links-media-fidelity-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Vérifier la syntaxe du navigateur de capture
        run: |
          node --check scripts/browser-capture-common.mjs
          node --check scripts/capture-recovered-bow.mjs
      - name: Capturer l'écran titre et cinq vrais états du jeu
        run: node scripts/capture-recovered-bow.mjs
      - name: Contrôler les nouvelles fiches et leur provenance
        run: npm test
      - name: Sauvegarder les preuves originales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-evil-bow-r20-${{ github.run_number }}
          path: |
            assets/presentations/resident-evil-bow-protocol.png
            assets/previews/resident-evil-bow-protocol.jpg
            assets/screenshots/resident-evil-bow-protocol/*.png
            docs/media-proof/resident-evil-bow-r20-2026-11-01.json
          if-no-files-found: warn
      - name: Ajouter les preuves réellement validées à la PR
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/presentations/resident-evil-bow-protocol.png assets/previews/resident-evil-bow-protocol.jpg \
            assets/screenshots/resident-evil-bow-protocol assets/recent-games.js assets/app-gallery.json \
            assets/source-native-media-manifest.json docs/MEDIA_FIDELITY_MATRIX_2026-11-01.json \
            docs/media-proof/resident-evil-bow-r20-2026-11-01.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media(bow): actual Resident Evil R20 title, specimens and player menu gallery"
          git fetch origin "refs/heads/${{ github.event.pull_request.head.ref }}"
          git rebase "origin/${{ github.event.pull_request.head.ref }}"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
