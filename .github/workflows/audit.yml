name: Audit du launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Vérifier le catalogue, les fichiers statiques et les destinations
        run: npm test
      - name: Vérifier les fiches, galeries et migrations dans Chromium
        run: npm run test:browser
