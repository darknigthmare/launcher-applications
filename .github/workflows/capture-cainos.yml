name: Launcher — captures natives CainOS et Encore

on:
  pull_request:
    paths:
      - "scripts/capture-cainos.mjs"
      - "scripts/refresh-cainos-arena.mjs"
      - ".github/workflows/capture-cainos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-cainos-native-capture
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/launcher-links-media-fidelity-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check native browser script syntax
        run: |
          node --check scripts/browser-capture-common.mjs
          node --check scripts/capture-cainos.mjs
          node --check scripts/refresh-cainos-arena.mjs
      - name: Capture real CainOS desktop and Encore fighter selection/duel
        run: node scripts/capture-cainos.mjs
      - name: Recadrer la vraie arène Encore, sans changer le gameplay
        run: node scripts/refresh-cainos-arena.mjs
      - name: Verify catalogue and media
        run: npm test
      - name: Preserve native image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cainos-encore-native-${{ github.run_number }}
          path: |
            docs/media-proof/cainos-encore-070-2026-11-01.json
            assets/screenshots/cainos/*.png
            assets/previews/cainos.jpg
          if-no-files-found: warn
      - name: Commit validated shots and historical archives
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/cainos assets/screenshots/previous/cainos \
            assets/previews/cainos.jpg assets/previews/previous/cainos.jpg \
            assets/app-gallery.json assets/app-gallery-admin.json \
            docs/MEDIA_FIDELITY_MATRIX_2026-11-01.json \
            docs/media-proof/cainos-encore-070-2026-11-01.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media(cainos): replace boot-only gallery with calibrated OS and real Encore combat"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
