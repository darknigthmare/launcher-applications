name: Launcher — recapture native TRIARCHE (5 scènes)

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Confirmer une recapture explicitement autorisée"
        required: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: launcher-triarche-capture
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref_name == 'codex/launcher-links-media-fidelity-20261101' && inputs.acknowledge == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer la branche candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Configurer Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Vérifier le script de capture
        run: node --check scripts/capture-triarche.mjs
      - name: Capturer cinq vraies scènes depuis la production du jeu
        run: node scripts/capture-triarche.mjs
      - name: Vérifier la cohérence du catalogue après recapture
        run: npm test
      - name: Conserver les preuves visuelles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triarch-gameplay-${{ github.run_number }}
          path: |
            docs/media-proof/triarch-gameplay-2026-11-01.json
            assets/screenshots/triarche-ciel-rouge/*.png
            assets/previews/triarche-ciel-rouge.jpg
          if-no-files-found: warn
      - name: Ajouter les captures natives et les archives à la PR
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/triarche-ciel-rouge assets/screenshots/previous/triarche-ciel-rouge \
            assets/previews/triarche-ciel-rouge.jpg assets/previews/previous/triarche-ciel-rouge.jpg \
            assets/app-gallery-admin.json docs/media-proof/triarch-gameplay-2026-11-01.json \
            docs/MEDIA_FIDELITY_MATRIX_2026-11-01.json
          if git diff --cached --quiet; then
            echo "Captures déjà à jour."
            exit 0
          fi
          git commit -m "media(triarche): replace menu-only gallery with live gameplay evidence"
          git push origin "HEAD:${{ github.ref_name }}"
