name: Launcher — captures natives Mass Effect Relay Chronicles

on:
  pull_request:
    paths:
      - "scripts/capture-relay-chronicles.mjs"
      - ".github/workflows/capture-relay-chronicles.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-relay-chronicles-native-media
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/launcher-links-media-fidelity-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Check out launcher PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate capture source
        run: |
          node --check scripts/browser-capture-common.mjs
          node --check scripts/capture-relay-chronicles.mjs
      - name: Real runtime title, commander and Normandy capture
        run: node scripts/capture-relay-chronicles.mjs
      - name: Check launcher catalogue and proof consistency
        run: npm test
      - name: Save native screenshots as workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-chronicles-native-${{ github.run_number }}
          path: |
            docs/media-proof/mass-effect-relay-native-2026-11-01.json
            assets/screenshots/mass-effect-relay-chronicles/*.png
            assets/presentations/mass-effect-relay-chronicles.png
            assets/previews/mass-effect-relay-chronicles.jpg
          if-no-files-found: warn
      - name: Commit only verified native media and report to the PR
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/mass-effect-relay-chronicles \
            assets/presentations/mass-effect-relay-chronicles.png \
            assets/previews/mass-effect-relay-chronicles.jpg \
            assets/recent-games.js assets/app-gallery.json \
            assets/source-native-media-manifest.json \
            docs/MEDIA_FIDELITY_MATRIX_2026-11-01.json \
            docs/media-proof/mass-effect-relay-native-2026-11-01.json
          if git diff --cached --quiet; then
            echo "Mass Effect gallery already committed"
            exit 0
          fi
          git commit -m "media(relay): real 0.3 title, commander, Normandy and equipment proof"
          git fetch origin "refs/heads/${{ github.event.pull_request.head.ref }}"
          git rebase FETCH_HEAD
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
