name: Vérifier et afficher l’adresse Vercel de Parallaxe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-parallaxe-link.yml']
permissions:
  contents: write
concurrency:
  group: launcher-parallaxe-link
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'darknigthmare/launcher-applications' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier le domaine public et préparer uniquement la fiche demandée
        run: node .delivery/parallaxe-link.mjs
      - name: Contrôler le catalogue entier et l’adresse visible
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/launcher-proof/tests.log"
      - name: Enregistrer la fiche sur main sans modifier le catalogue
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js package.json scripts/audit.mjs scripts/parallaxe-launch-link.test.mjs docs/parallaxe-vercel-20261116.json
          git rm .delivery/parallaxe-link.mjs
          git diff --quiet HEAD -- assets/recent-games.js docs/MEDIA_FIDELITY_MATRIX_2026-11-01.json
          git commit -m 'feat: expose the verified Parallaxe Vercel address in its game details'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > "$RUNNER_TEMP/launcher-proof/COMMIT.txt"
          git diff HEAD~1 HEAD > "$RUNNER_TEMP/launcher-proof/PARALLAXE_LINK.patch"
      - name: Conserver les preuves
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/launcher-proof"
          tar -czf "$RUNNER_TEMP/launcher-proof/launcher-code.tar.gz" index.html assets/recent-games.js assets/catalogue-updates.js sw.js package.json scripts docs/parallaxe-vercel-20261116.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallaxe-launcher-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/launcher-proof/
          if-no-files-found: warn
          retention-days: 14
