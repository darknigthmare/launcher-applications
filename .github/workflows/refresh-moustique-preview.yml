name: Launcher — finaliser aperçu MOUSTIQUE WebGL2

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Autoriser explicitement : Aperçu du balcon WebGL2"
        required: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: launcher-moustique-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref_name == 'codex/launcher-links-media-fidelity-20261101' && inputs.acknowledge == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Capturer l'aperçu réellement rendu du balcon
        run: node scripts/capture-moustique.mjs --refresh-preview
      - name: Contrôler la cohérence du catalogue
        run: npm test
      - name: Conserver aperçu et preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moustique-balcon-preview-${{ github.run_number }}
          path: |
            assets/previews/moustique-the-video-game.jpg
            docs/media-proof/moustique-webgl2-2026-11-01.json
          if-no-files-found: warn
      - name: Mettre à jour l'aperçu lié aux preuves
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews/moustique-the-video-game.jpg docs/media-proof/moustique-webgl2-2026-11-01.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media(moustique): use daylight balcony as verified gameplay preview"
          git push origin "HEAD:${{ github.ref_name }}"
