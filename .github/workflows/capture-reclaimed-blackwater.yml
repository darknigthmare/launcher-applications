name: Launcher — captures natives Reclaimed After Dark

on:
  pull_request:
    paths:
      - "scripts/capture-reclaimed-blackwater.mjs"
      - ".github/workflows/capture-reclaimed-blackwater.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-reclaimed-blackwater-media
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/launcher-links-media-fidelity-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check actual game browser capture
        run: |
          node --check scripts/browser-capture-common.mjs
          node --check scripts/capture-reclaimed-blackwater.mjs
      - name: Capture five scenes of actual 2.0 Blackwater game
        run: node scripts/capture-reclaimed-blackwater.mjs
      - name: Verify all launcher media integrity tests
        run: npm test
      - name: Attach native frames and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reclaimed-blackwater-native-${{ github.run_number }}
          path: |
            docs/media-proof/reclaimed-blackwater-200-native-2026-11-01.json
            assets/screenshots/reclaimed-after-dark/*.png
            assets/presentations/reclaimed-after-dark.png
            assets/previews/reclaimed-after-dark.jpg
          if-no-files-found: warn
      - name: Commit verified game frames and provenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/reclaimed-after-dark \
            assets/presentations/reclaimed-after-dark.png assets/previews/reclaimed-after-dark.jpg \
            assets/recent-games.js assets/app-gallery.json assets/source-native-media-manifest.json \
            docs/MEDIA_FIDELITY_MATRIX_2026-11-01.json \
            docs/media-proof/reclaimed-blackwater-200-native-2026-11-01.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media(reclaimed): native Blackwater 2.0 campaign and playable expedition"
          git fetch origin "refs/heads/${{ github.event.pull_request.head.ref }}"
          git rebase FETCH_HEAD
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
