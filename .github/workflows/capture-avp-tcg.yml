name: Launcher — captures natives AVP HUNT HIVE TCG

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Autoriser explicitement la recapture complète AVP TCG"
        required: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: launcher-avp-tcg-media
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref_name == 'codex/launcher-links-media-fidelity-20261101' && inputs.acknowledge == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout launcher PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check screenshot capture syntax
        run: |
          node --check scripts/browser-capture-common.mjs
          node --check scripts/capture-avp-tcg.mjs
      - name: Capture first-use TCG gameplay and UI from verified public production
        run: node scripts/capture-avp-tcg.mjs
      - name: Verify all launcher media
        run: npm test
      - name: Keep screenshot captures as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avp-tcg-native-${{ github.run_number }}
          path: |
            docs/media-proof/avp-tcg-gameplay-2026-11-01.json
            assets/screenshots/avp-hunt-hive-tcg/*.png
            assets/previews/avp-hunt-hive-tcg.png
          if-no-files-found: warn
      - name: Publish images and preserve previous version in editor archives
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/avp-hunt-hive-tcg assets/screenshots/previous/avp-hunt-hive-tcg \
            assets/previews/avp-hunt-hive-tcg.png assets/previews/previous/avp-hunt-hive-tcg.png \
            assets/app-gallery.json assets/app-gallery-admin.json \
            docs/MEDIA_FIDELITY_MATRIX_2026-11-01.json docs/media-proof/avp-tcg-gameplay-2026-11-01.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media(avp-tcg): publish five real TCG screens and archive previous gallery"
          git push origin "HEAD:${{ github.ref_name }}"
