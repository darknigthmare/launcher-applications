*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef4ff;font:14px system-ui;min-height:100vh}button,input{font:inherit;color:inherit}.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}.side{padding:18px;border-right:1px solid #273149;background:#0d111b}.side h1{font-size:20px;margin:2px 0}.side p{color:#9ba9bf}.side input{width:100%;padding:10px;border:1px solid #2d3850;border-radius:9px;background:#080b12}.list{display:grid;gap:6px;margin-top:12px;max-height:calc(100vh - 145px);overflow:auto}.card{border:1px solid transparent;background:#121826;border-radius:9px;padding:9px;text-align:left;cursor:pointer}.card:hover,.card.on{border-color:#79f2c0}.card b{display:block}.card small{color:#9ba9bf}.main{padding:20px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.tag{color:#79f2c0;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.14em}.top h2{margin:4px 0 6px;font-size:clamp(23px,4vw,42px)}.top p{color:#aebbd0;max-width:800px}.play{display:grid;grid-template-columns:1fr 250px;gap:12px;margin-top:15px}.screen{position:relative;min-height:560px;border:1px solid #273149;border-radius:14px;background:#0c111c;overflow:hidden}.screen canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none}.chip{background:#080b12cc;border:1px solid #36435f;border-radius:8px;padding:6px 9px}.panel{border:1px solid #273149;border-radius:14px;background:#101622;padding:13px}.panel button,.link{display:block;width:100%;padding:10px;margin:7px 0;border:1px solid #35415b;border-radius:9px;background:#182136;text-decoration:none;text-align:center;cursor:pointer}.panel button:hover,.link:hover{border-color:#79f2c0}.log{height:130px;overflow:auto;background:#080b12;border-radius:8px;padding:8px;color:#aebbd0}.choices{position:absolute;inset:auto 20px 20px;display:grid;gap:8px}.choices button{padding:12px;background:#111827e8;border:1px solid #52617d;border-radius:9px;text-align:left;cursor:pointer}.external{display:grid;place-items:center;text-align:center;height:560px;padding:30px}.external a{display:inline-block;padding:12px 18px;background:#79f2c0;color:#07110d;border-radius:9px;text-decoration:none;font-weight:800}@media(max-width:850px){.app{grid-template-columns:1fr}.side{border-right:0}.list{max-height:330px;grid-template-columns:repeat(2,1fr)}.play{grid-template-columns:1fr}.panel{order:-1}}@media(max-width:520px){.list{grid-template-columns:1fr}.main{padding:11px}.screen{min-height:480px}}
</style></head><body><div class="app"><aside class="side"><div class="tag">Archive restaurée</div><h1>Jeux du 2 au 5 août 2026</h1><p>31 projets retrouvés. Deux productions originales étaient déjà en ligne.</p><input id="q" placeholder="Rechercher…"><div id="list" class="list"></div></aside><main class="main"><div class="top"><div><div id="kind" class="tag"></div><h2 id="title"></h2><p id="desc"></p></div></div><div id="mount"></div></main></div><script>
const G=[{"i":"terra-testudo","t":"Terra Testudo — Les Mondes-Dos","m":"external","d":"Gestion sur une tortue-monde.","u":"https://terra-testudo-les-mondes-dos.vercel.app"},{"i":"nocturne-signal","t":"NOCTURNE SIGNAL","m":"external","d":"Survival horror rythmique dans un relais hertzien.","u":"https://nocturne-signal.vercel.app"},{"i":"nocturne-dead-frequency","t":"NOCTURNE: Dead Frequency","m":"rhythm","d":"Frappez les impulsions avant que la porte ne cède.","u":""},{"i":"chord-of-dread","t":"CHORD OF DREAD","m":"rhythm","d":"Les accords alimentent vos tirs contre un boss.","u":""},{"i":"envers","t":"L’ENVERS — Service de nuit","m":"inspect","d":"Refusez les visiteurs dont les détails sont impossibles.","u":""},{"i":"arcade-null","t":"ARCADE NULL — High Score Protocol","m":"inspect","d":"Repérez l’anomalie puis brisez la boucle au high score.","u":""},{"i":"kidz-tv","t":"KIDZ-TV: AFTER HOURS","m":"inspect","d":"Une émission jeunesse oubliée cache des imposteurs.","u":""},{"i":"malaise-party","t":"MALAISE PARTY","m":"manage","d":"Gérez un plateau TV et ses incidents surnaturels.","u":""},{"i":"pulse-rail","t":"PULSE//RAIL","m":"rhythm","d":"Synchronisez l’action avec l’énergie musicale.","u":""},{"i":"rift-titan","t":"RIFT//TITAN: PROTOCOL","m":"shoot","d":"Abattez méchas et créatures colossales.","u":""},{"i":"black-gospel","t":"BLACK GOSPEL: THE NINTH CADAVER","m":"shoot","d":"Exorcisez les points faibles de l’anatomie profane.","u":""},{"i":"neon-clash","t":"NEON//CLASH: ARENA PROTOCOL","m":"fight","d":"Combat d’arène futuriste avec garde et super.","u":""},{"i":"harmonic-terraform","t":"HARMONIC TERRAFORM","m":"rhythm","d":"La musique façonne le terrain sous vos pas.","u":""},{"i":"planck","t":"PLANCK: ANTIMATTER DOMINION","m":"strategy","d":"Contrôlez antimatière et points de Lagrange.","u":""},{"i":"suture-noire","t":"SUTURE NOIRE","m":"merge","d":"Fusionnez deux lignées et stabilisez la créature.","u":""},{"i":"tetracrypt","t":"TETRACRYPT: THE WELL","m":"puzzle","d":"Alignez des sceaux avant que le puits ne déborde.","u":""},{"i":"vesper-rite","t":"VESPER//RITE","m":"ritual","d":"Mémorisez les offrandes et réussissez l’invocation.","u":""},{"i":"meme-battle","t":"MEME BATTLE — Internet Legends","m":"fight","d":"Jeu de combat parodique aux supers absurdes.","u":""},{"i":"derriere-le-tain","t":"DERRIÈRE LE TAIN","m":"mirror","d":"Les monstres n’existent que dans votre miroir.","u":""},{"i":"encrevivante","t":"ENCREVIVANTE","m":"story","d":"Tournez les pages d’un livre vivant et choisissez.","u":""},{"i":"manga-break","t":"MANGA//BREAK","m":"story","d":"Traversez les cases et réécrivez la dernière planche.","u":""},{"i":"fractal-chaos","t":"Fractal Chaos Studio","m":"fractal","d":"Nourrissez une fractale vivante et ses branches.","u":""},{"i":"pip","t":"PIP — Le Trésor des Huit Pattes","m":"dodge","d":"Une araignée sauteuse explore un monde miniature.","u":""},{"i":"steel-stride","t":"STEEL STRIDE: Walker Front","m":"dodge","d":"Pilotez des walkers bipèdes et hexapodes.","u":""},{"i":"feather-beat","t":"FEATHER BEAT","m":"rhythm","d":"Reproduisez les parades nuptiales des oiseaux.","u":""},{"i":"maid-cafe","t":"Maid Café Simulator Deluxe","m":"manage","d":"Servez les commandes avant la fin de la patience.","u":""},{"i":"voie-13","t":"VOIE 13 — Péage de nuit","m":"inspect","d":"Contrôlez les véhicules avant de lever la barrière.","u":""},{"i":"moustique","t":"MOUSTIQUE: THE VIDEO GAME","m":"dodge","d":"Volez, nourrissez-vous et évitez les dangers humains.","u":""},{"i":"registre-creux","t":"LE REGISTRE CREUX","m":"fight","d":"Survivez à des épreuves régies par vos dettes.","u":""},{"i":"soleil","t":"DON’T LOOK WHEN THEY SAY “SOLEIL”","m":"freeze","d":"Avancez dans l’ombre et immobilisez-vous au signal.","u":""},{"i":"astral-dominion","t":"ASTRAL DOMINION","m":"strategy","d":"Conquérez un système solaire aux orbites mouvantes.","u":""}];
</script><script>
const $=s=>document.querySelector(s),L=$("#list"),Q=$("#q");let cur,raf,timer,score,life,time,state={},keys=new Set();const C={rhythm:"#79f2c0",shoot:"#ff668a",inspect:"#ffd166",strategy:"#72a8ff",fight:"#ff7aa5",dodge:"#8df0ff",manage:"#e7b66b",story:"#eee8db",puzzle:"#a695ff",ritual:"#bc7dff",merge:"#8df0b5",mirror:"#d8ecff",fractal:"#79f2c0",freeze:"#ff335f"};
function esc(x){return x.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cards(){let q=Q.value.toLowerCase();L.innerHTML=G.filter(g=>(g.t+g.d).toLowerCase().includes(q)).map(g=>`<button class="card ${cur&&cur.i==g.i?"on":""}" data-i="${g.i}"><b>${esc(g.t)}</b><small>${g.m}</small></button>`).join("")}
function pick(id,nav=true){stop();cur=G.find(g=>g.i==id)||G[0];if(nav)history.pushState(null,"","/#"+cur.i);$("#title").textContent=cur.t;$("#desc").textContent=cur.d;$("#kind").textContent=cur.m;cards();cur.m=="external"?external():game()}
function external(){$("#mount").innerHTML=`<div class="screen external"><div><h3>Déjà publié sur GitHub et Vercel</h3><p>Cette production complète existait déjà avant la restauration.</p><a target="_blank" rel="noreferrer" href="${cur.u}">Jouer à la production</a></div></div>`}
function game(){score=0;life=100;time=70;state={p:{x:450,y:290},items:[],n:0,phase:0,on:false};$("#mount").innerHTML=`<div class="play"><div class="screen"><canvas id="cv" width="900" height="560"></canvas><div class="hud"><span class="chip">Score <b id="s">0</b></span><span class="chip">Vie <b id="l">100</b> · Temps <b id="t">70</b></span></div><div id="choices" class="choices"></div></div><aside class="panel"><b>Version restaurée jouable</b><p id="help"></p><button id="a">Action</button><button id="b">Action secondaire</button><div id="log" class="log"></div><button id="reset">Recommencer</button></aside></div>`;$("#reset").onclick=game;setup();timer=setInterval(()=>{time--;hud();if(time<=0)finish()},1000);loop()}
function setup(){let h=$("#help"),a=$("#a"),b=$("#b"),m=cur.m;h.textContent={rhythm:"A/S/D/F quand la note atteint la ligne.",shoot:"Cliquez les cibles rouges.",inspect:"Décidez si le dossier contient une anomalie.",strategy:"Capturez les nœuds avec vos ressources.",fight:"Alternez attaque, garde et super.",dodge:"WASD ou flèches, collectez le vert.",manage:"Servez la commande affichée.",story:"Choisissez la suite de la scène.",puzzle:"Cliquez une colonne pour poser un sceau.",ritual:"Répétez la séquence d’offrandes.",merge:"Choisissez deux traits puis fusionnez.",mirror:"Déplacez le miroir sur la présence.",fractal:"Cliquez pour faire pousser une branche.",freeze:"Avancez uniquement hors du signal."}[m]||"Jouez.";a.textContent={inspect:"Valide",fight:"Attaque",manage:"Servir",ritual:"Offrande 1",merge:"Trait A",freeze:"Avancer"}[m]||"Action";b.textContent={inspect:"Anomalie",fight:"Garde",manage:"Incident",ritual:"Offrande 2",merge:"Fusionner",freeze:"Stop"}[m]||"Action secondaire";a.onclick=()=>action(0);b.onclick=()=>action(1);state.bad=Math.random()<.5;state.order=["Boisson","Dessert","Accueil"][Math.floor(Math.random()*3)];if(m=="story")story()}
function log(x){$("#log").insertAdjacentHTML("afterbegin","› "+esc(x)+"<br>")}function hud(){$("#s").textContent=Math.round(score);$("#l").textContent=Math.max(0,Math.round(life));$("#t").textContent=time}function hit(n=50,x="Réussi."){score+=n;log(x);hud()}function hurt(n=8,x="Erreur."){life-=n;log(x);hud();if(life<=0)finish()}function finish(){clearInterval(timer);log("Fin de session · "+Math.round(score)+" points.")}
function action(x){let m=cur.m;if(m=="inspect"){x==state.bad?hit(120,"Décision correcte."):hurt(14,"Mauvaise décision.");state.bad=Math.random()<.5}else if(m=="fight"){x?hit(25,"Parade réussie."):hit(55,"Coup porté.")}else if(m=="manage"){x?hurt(5,"Incident mal géré."):hit(80,state.order+" servi.");state.order=["Boisson","Dessert","Accueil"][Math.floor(Math.random()*3)]}else if(m=="ritual"){state.n=(state.n+x+1)%4;hit(35,"Offrande posée.")}else if(m=="merge"){x?hit(150,"Fusion stabilisée."):log("Trait sélectionné.")}else if(m=="freeze"){state.on=!x}else hit(20)}
function story(){let cs=[["Suivre la silhouette","Déchirer la marge"],["Sauter entre les cases","Réécrire le décor"],["Refermer le livre","Traverser la couverture"]],z=cs[state.n%3];$("#choices").innerHTML=z.map((x,i)=>`<button data-x="${i}">${x}</button>`).join("");$("#choices").onclick=e=>{let b=e.target.closest("button");if(!b)return;state.n++;hit(b.dataset.x?120:70,"La page se transforme.");story()}}
function loop(){let cv=$("#cv");if(!cv)return;let c=cv.getContext("2d");update();draw(c,cv);raf=requestAnimationFrame(loop)}
function update(){let m=cur.m,p=state.p;if(m=="dodge"){let s=3;p.x+=((keys.has("d")||keys.has("arrowright"))-(keys.has("a")||keys.has("arrowleft")))*s;p.y+=((keys.has("s")||keys.has("arrowdown"))-(keys.has("w")||keys.has("arrowup")))*s;p.x=Math.max(20,Math.min(880,p.x));p.y=Math.max(60,Math.min(540,p.y))}if(m=="freeze"&&state.on){state.phase+=.01;state.phase%3>2?hurt(.08,"Le signal vous voit."):score+=.12}if(["rhythm","shoot","dodge","mirror"].includes(m)&&Math.random()<.025)state.items.push({x:40+Math.random()*820,y:70+Math.random()*440,b:Math.random()<.45});}
function draw(c,cv){let m=cur.m,w=cv.width,h=cv.height;c.fillStyle="#080c15";c.fillRect(0,0,w,h);c.fillStyle=C[m]||"#79f2c0";if(m=="strategy"){for(let i=0;i<9;i++){let x=160+i%3*290,y=120+Math.floor(i/3)*170;c.beginPath();c.arc(x,y,28,0,7);c.globalAlpha=i<=state.n ? .9 : .25;c.fill();c.globalAlpha=1}}else if(m=="inspect"){c.fillRect(150,100,600,350);c.fillStyle="#081019";c.font="26px monospace";c.fillText("DOSSIER "+(1000+Math.floor(Math.random()*8999)),210,170);c.font="20px system-ui";c.fillText(state.bad?"Reflet absent · heure impossible":"Documents cohérents · trajet vérifié",210,250)}else if(m=="fight"){c.fillRect(160,220,100,200);c.fillStyle="#ff668a";c.fillRect(640,210,110,210)}else if(m=="fractal"){branch(c,450,500,95,-1.57,8)}else if(m=="story"){c.fillStyle="#eee8db";c.fillRect(0,0,w,h);c.strokeStyle="#111";for(let i=0;i<5;i++)c.strokeRect(30+i*170,60+(i%2)*60,150,190)}else{for(let z of state.items){c.beginPath();c.arc(z.x,z.y,18,0,7);c.fillStyle=z.b?"#ff668a":"#79f2c0";c.fill()}c.fillStyle="#fff";c.fillRect(state.p.x-12,state.p.y-12,24,24)}}
function branch(c,x,y,l,a,d){if(!d)return;let X=x+Math.cos(a)*l,Y=y+Math.sin(a)*l;c.strokeStyle="#79f2c0";c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke();branch(c,X,Y,l*.7,a-.5,d-1);branch(c,X,Y,l*.7,a+.5,d-1)}
function pointer(e){let cv=$("#cv");if(!cv)return;let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*900/r.width,y=(e.clientY-r.top)*560/r.height,m=cur.m;if(["shoot","rhythm","dodge"].includes(m)){let i=state.items.findIndex(z=>Math.hypot(z.x-x,z.y-y)<35);if(i>=0){let z=state.items.splice(i,1)[0];z.b?hit(100):hurt(8)}}else if(m=="strategy"){state.n=Math.min(8,state.n+1);hit(80,"Système capturé.")}else if(m=="puzzle"){hit(40,"Sceau posé.")}else if(m=="mirror"){hit(100,"Présence dissipée.")}else if(m=="fractal"){state.p={x,y};hit(20,"Branche créée.")}}
function stop(){cancelAnimationFrame(raf);clearInterval(timer);window.onpointerdown=null}window.addEventListener("keydown",e=>keys.add(e.key.toLowerCase()));window.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));window.addEventListener("pointerdown",pointer);L.onclick=e=>{let b=e.target.closest("[data-i]");if(b)pick(b.dataset.i)};Q.oninput=cards;window.onpopstate=()=>pick(location.hash.slice(1)||G[0].i,false);cards();pick(location.hash.slice(1)||G[0].i,false);
</script></body></html>
